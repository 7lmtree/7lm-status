<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>7LM Status</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>
    <header class="top">
      <a class="brand" href="./">7LM<span>Status</span></a>
      <nav id="nav">
        <a class="on" href="./">Service Status</a>
      </nav>
      <div id="headerBadge" class="pill checking">…</div>
    </header>

    <main>
      <section id="banner" class="banner checking">
        <div>
          <h1 id="bannerTitle">جاري الفحص…</h1>
          <p id="bannerSub">نتحقق من كل الخدمات الآن.</p>
        </div>
        <div class="uptime-box">
          <p class="uptime-label">آخر 90 فحص</p>
          <p id="uptimePct" class="uptime-pct">—</p>
        </div>
        <p id="bannerMeta" class="banner-meta"></p>
      </section>

      <section class="services">
        <div class="services-head">
          <h2>Services</h2>
          <button id="refreshBtn" type="button" class="btn">Refresh</button>
        </div>
        <div id="groups"></div>
      </section>
    </main>

    <footer>
      <p>7LM Status · يُحدَّث تلقائيًا كل دقيقة · محلي: <code>/api/status</code></p>
    </footer>
    <script src="./app.js" type="module"></script>
  </body>
</html>
